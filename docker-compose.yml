services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: code_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_analysis_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - codementor-net

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - codementor-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - codementor-net

  code-service:
    build:
      context: ./code-service
      dockerfile: Dockerfile
    container_name: code-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:p6spy:postgresql://postgres:5432/code_analysis_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.p6spy.engine.spy.P6SpyDriver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: code-exchange
      RABBITMQ_ROUTINGKEY: code-routing-key
      # Producer no longer declares/uses a result queue (results are persisted to DB + Redis).
      # Shared Redis TTL (default 24h).
      TASK_STATUS_TTL: ${TASK_STATUS_TTL:-24h}
      TASK_RESULT_TTL: ${TASK_RESULT_TTL:-24h}
      # JWT auth: secret supplied from env (base64, >= 256-bit). Never committed.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required (>= 256-bit base64)}
      JWT_ISSUER: ${JWT_ISSUER:-codementor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api-gateway}
      ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION:-900000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800000}
      # Local (http) development: Secure=false. Set true behind HTTPS in production.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}
    # code-service is internal: only the gateway (8080) is published publicly.
    # Port 8084 is NOT exposed, so the X-User-Id header it trusts can only
    # originate from the gateway on codementor-net (network-level isolation).
    networks:
      - codementor-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:p6spy:postgresql://postgres:5432/code_analysis_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.p6spy.engine.spy.P6SpyDriver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: code-exchange
      RABBITMQ_ROUTINGKEY: code-routing-key
      RABBITMQ_QUEUE_NAME: code.analysis.queue
      # Shared Redis read-model TTL (matches gateway/code-service contract).
      TASK_STATUS_TTL: ${TASK_STATUS_TTL:-24h}
    ports:
      - "8083:8083"
    networks:
      - codementor-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      code-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://code-service:8084
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/v1/**
      CODE_MENTOR_RATE_LIMITER_REPLENISH_RATE: 2
      CODE_MENTOR_RATE_LIMITER_BURST_CAPACITY: 5
      CODE_MENTOR_RATE_LIMITER_REQUESTED_TOKENS: 1
      # JWT auth: gateway and code-service share secret/issuer/audience (never committed)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required (>= 256-bit base64)}
      JWT_ISSUER: ${JWT_ISSUER:-codementor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api-gateway}
      ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION:-900000}
      # Auth brute-force protection (per-IP, on /api/v1/auth/**)
      AUTH_RATELIMIT_MAX_ATTEMPTS: ${AUTH_RATELIMIT_MAX_ATTEMPTS:-10}
      AUTH_RATELIMIT_WINDOW_SECONDS: ${AUTH_RATELIMIT_WINDOW_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - codementor-net

networks:
  codementor-net:
    driver: bridge
