server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: code-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                allowedHeaders: "*"

# Prompt/AI (kod analiz) endpointi icin rate limiter ayarlari
# RedisRateLimiter bean'i (RateLimiterConfig) tarafindan kullanilir
code-mentor:
  rate-limiter:
    replenish-rate: 2    # saniyede kovaya eklenen token
    burst-capacity: 5    # kova kapasitesi (ani burst izni)
    requested-tokens: 1  # her istek icin harcanan token

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
