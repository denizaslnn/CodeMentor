server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: code-service
              uri: ${CODE_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@userAwareKeyResolver}"
            # code-service Swagger UI / OpenAPI dokumani. code-service portu dışa
            # kapali oldugu icin (X-User-Id spoof korumasi) dokuman yalnizca gateway
            # uzerinden servis edilir. /api/v1 disinda kaldigi icin JWT istemez.
            - id: code-service-docs
              uri: ${CODE_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/v3/api-docs
          globalcors:
            cors-configurations:
              '[/**]':
                # Credentialed (cookie) traffic requires explicit origins - "*" + allowCredentials is invalid.
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

# JWT auth: secret asla hard-code edilmez; JWT_SECRET environment variable'dan gelir.
# code-service ile BIREBIRE AYNI secret + issuer/audience kullanilmalidir.
# Secret en az 256-bit (32 byte base64-decode edilmis) olmalidir (JwtUtil fail-fast).
jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:codementor}
  audience: ${JWT_AUDIENCE:api-gateway}
  # Access token TTL (ms). Default: 15 dk
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900000}

# Auth brute-force protection (api-gateway AuthRateLimitWebFilter, /api/v1/auth/** per IP)
app:
  auth:
    ratelimit:
      max-attempts: ${AUTH_RATELIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${AUTH_RATELIMIT_WINDOW_SECONDS:60}

code-mentor:
  rate-limiter:
    replenish-rate: 2    # saniyede kovaya eklenen token
    burst-capacity: 5    # kova kapasitesi (ani burst izni)
    requested-tokens: 1  # her istek icin harcanan token

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
