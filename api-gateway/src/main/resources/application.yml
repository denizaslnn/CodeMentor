server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: code-service
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/v1/**

# CORS Ayarları (İleride Frontend bağladığımızda sorun yaşamamak için)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"