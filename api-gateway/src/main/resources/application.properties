# JWT secret must be Base64-encoded and decode to at least 32 bytes (256-bit) for HS256.
# Keep secrets in environment/secret manager; do not hard-code.
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:codementor}
jwt.audience=${JWT_AUDIENCE:api-gateway}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:900000}
