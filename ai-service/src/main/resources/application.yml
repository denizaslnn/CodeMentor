server:
  port: 8083

spring:
  # Yerel gelistirme: repo kokundeki .env dosyasi (Docker Compose'un okudugu ayni
  # dosya) IDE'den calistirildiginda da okunur. Boylece secret tek bir yerde durur,
  # IDE run configuration'ina elle environment variable girmeye gerek kalmaz.
  # 'optional:' -> dosya yoksa uygulama yine acilir. Container icinde bu dosya
  # bulunmaz; oradaki degerler zaten OS environment variable olarak gelir ve
  # environment variable'lar config import'undan once gelir (onlar kazanir).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  messages:
    # Varsayilan dil Turkce (messages.properties). fallback-to-system-locale=false olmadan
    # bilinmeyen/istenmeyen locale'ler JVM sistem locale'ine (orn. en) dusuyordu.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  application:
    name: ai-service
  datasource:
    url: jdbc:p6spy:postgresql://localhost:5432/code_analysis_db
    username: postgres
    password: postgres_password
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    hibernate:
      # ai-service owns no Flyway migration of its own; it relies on
      # code-service's Flyway V1 for the shared schema. `update` validates the
      # entity mappings without dropping columns (prefer `validate` + the
      # validate entity mappings against the shared schema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Consumer-owned RabbitMQ topology (no result exchange/queue - ai-service
# persists analysis output to DB + Redis only).
rabbitmq:
  exchange: code-exchange
  routingkey: code-routing-key
  queue:
    name: code.analysis.queue
  # Dead-letter exchange / queue / routing-key for poison-message isolation.
  dlx:
    name: code.analysis.dlx
  dlq:
    name: code.analysis.dlq
    routingkey: code.analysis.dead

# Redis read-model TTL (matches the code-service / gateway key-layout contract).
app:
  redis:
    task-status-ttl: ${TASK_STATUS_TTL:PT24H}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.engine.jdbc.spi.SqlStatementLogger: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    p6spy: INFO
