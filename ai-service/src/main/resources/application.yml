server:
  port: 8083

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://localhost:5432/code_analysis_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

rabbitmq:
  exchange: code-exchange
  routingkey: code-routing-key
  queue:
    name: code.analysis.queue
  result:
    exchange: code-exchange
    queue: code.result.queue
    routingkey: code.result.routing-key
