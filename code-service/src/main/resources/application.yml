server:
  port: 8084

spring:
  application:
    name: code-service
  messages:
    # Varsayilan dil Turkce (messages.properties). fallback-to-system-locale=false olmadan
    # bilinmeyen/istenmeyen locale'ler JVM sistem locale'ine (orn. en) dusuyordu.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # docker-compose'daki POSTGRES_DB: code_analysis_db ile uyumlu olmalı
    url: jdbc:p6spy:postgresql://localhost:5432/code_analysis_db
    username: postgres
    # docker-compose'daki POSTGRES_PASSWORD: postgres_password ile uyumlu olmalı
    password: postgres_password
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    hibernate:
      # Schema Flyway tarafindan yonetilir; Hibernate sadece dogrular (production-ready).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Mevcut (ddl-auto:update ile olusmus) sifirdan dolu bir schema varsa onu V0 olarak
    # baseline'lar, ardindan V1 migration'i uygular -> veri kaybi yok.
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379

rabbitmq:
   exchange: code-exchange
   routingkey: code-routing-key

app:
  redis:
    # Redis cache/read-model TTL'leri (config uzerinden yonetilebilir).
    # Status/result anahtarlari suresiz kalanmaz; bu TTL'lerle otomatik silinir.
    task-status-ttl: ${TASK_STATUS_TTL:24h}
    task-result-ttl: ${TASK_RESULT_TTL:24h}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.engine.jdbc.spi.SqlStatementLogger: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    p6spy: INFO

# JWT / auth configuration.
# api-gateway ile BIREBIRE AYNI secret + issuer kullanilmalidir (JWT_SECRET env).
# Secret asla source code'e gomulmez; sadece environment variable/secret manager uzerinden gelir.
# Secret en az 256-bit (32 byte base64-decode edilmis) olmalidir (JwtTokenProvider fail-fast).
jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:codementor}
  audience: ${JWT_AUDIENCE:api-gateway}
  # Access token TTL (ms). Default: 15 dk
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900000}
  # Refresh token TTL (ms). Default: 7 gun
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    # Production'da HTTPS uzerinden Secure cookie sart; dev (http) icin "false" verin.
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # Cookie yalnizca auth endpoint'lerine gonderilir (minimum exposure).
    path: ${REFRESH_COOKIE_PATH:/api/v1/auth}

# OpenAPI / Swagger UI. Dokuman api-gateway (8080) uzerinden servis edilir.
# config-url/url explicit verilir ve swagger-ui'nin petstore default'u kapatilir;
# aksi halde /swagger-ui/index.html'e dogrudan girildiginde UI petstore'a bakiyor
# (webjar default'u) ve bos aciliyor.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    disable-swagger-default-url: true
